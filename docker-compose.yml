services:
  postgres:
    image: postgres:16-alpine
    container_name: nexora-team4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: ${POSTGRES_DB:-nexora_team4}
    ports:
      - "5432:5432"
    volumes:
      - team4-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora_team4}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  team4-postgres-data:
